services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - PARTITION_DB_PATH=/srv/app/var/etl.sqlite3
    volumes:
      - ./backend/var:/srv/app/var
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
